<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request Status</title><style>body{margin:0;background:#080808;color:#eee;font-family:Arial}.wrap{max-width:680px;margin:70px auto;padding:30px 22px}h1{color:#e6c873}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:10px;margin:7px 0}input{background:#151515;border:1px solid #555;color:#fff}button{background:#e6c873;border:0;font-weight:800}.card{margin-top:20px;padding:20px;border:1px solid #4a3d21;border-radius:15px;background:#111}.muted{color:#aaa;line-height:1.6}</style></head><body><main class="wrap"><h1>Request Status</h1><p class="muted">Enter the reference supplied by the community. A status result is informational and does not constitute a payment confirmation or prize guarantee.</p><input id="ref" placeholder="Reference ID"><button id="lookup">Check Status</button><div id="result"></div><p><a href="index.html" style="color:#e6c873">Return home</a></p></main><script>
document.getElementById("lookup").onclick=async function(){const ref=document.getElementById("ref").value.trim(),box=document.getElementById("result");if(!ref){box.innerHTML='<div class="card">Please enter a reference ID.</div>';return}box.innerHTML='<div class="card">Checking…</div>';try{const r=await fetch("https://api.jsonbin.io/v3/b/6a806543da38895dfee86ff1/latest",{cache:"no-store"});if(!r.ok)throw 0;const j=await r.json(),d=j.record,rows=Array.isArray(d)?d:(d.records||d.submissions||[]),f=rows.find(x=>String(x.referenceId||x.reference||x.tokenId||"").toLowerCase()===ref.toLowerCase());box.innerHTML=f?'<div class="card"><b>Reference:</b> '+(f.referenceId||f.reference||f.tokenId)+'<br><b>Status:</b> '+(f.status||"Received")+'<br><p class="muted">Your request has been received and is awaiting review.</p></div>':'<div class="card">No matching public status was found.</div>'}catch(e){box.innerHTML='<div class="card">Status lookup is temporarily unavailable. Please try again later.</div>'}};
</script></body></html>
